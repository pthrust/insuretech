http {
    # ============================================================
    # «она Rate Limiting
    # ============================================================
    # $binary_remote_addr Ч ключ по IP клиента (можно заменить на $http_x_api_key
    # дл€ ограничени€ по API-ключу партнЄра Ч что правильнее дл€ B2B).
    # zone=partner_zone:10m Ч 10 ћЅ пам€ти (~160 тыс. IP-адресов).
    # rate=10r/m Ч 10 запросов в минуту.
    limit_req_zone $binary_remote_addr zone=partner_zone:10m rate=10r/m;

    #  од ответа при превышении лимита Ч 429 Too Many Requests
    limit_req_status 429;

    # Ћогирование отказов по лимиту в отдельный уровень
    limit_req_log_level warn;

    # ============================================================
    # Upstream дл€ балансировки нагрузки
    # ============================================================
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # ѕримен€ем ограничение:
            #   burst=10 Ч разрешаем очередь из 10 запросов сверх лимита;
            #   nodelay Ч обрабатываем их сразу, а не с задержкой.
            # »тог: при всплеске клиент может отправить 10 мгновенно,
            # далее Ч не более 10 запросов в минуту.
            limit_req zone=partner_zone burst=10 nodelay;

            proxy_pass http://backend_servers;
        }
    }
}